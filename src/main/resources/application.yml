server:
  port: 8080

spring:
  application:
    name: ride-hailing-backend

logging:
  level:
    com.ridehailing: INFO

ride-hailing:
  matching:
    search-radius-km: 5.0
  surge:
    maximum-multiplier: 3.0
  cancellation:
    free-window-seconds: 120
    fee: 30.00
  pricing:
    minimum-fare-floor: 50.00
    tiers:
      HATCHBACK:
        - max-distance: 5
          rate-per-distance: 10.00
        - max-distance: 10
          rate-per-distance: 8.00
        - rate-per-distance: 6.00
      SEDAN:
        - max-distance: 5
          rate-per-distance: 12.00
        - max-distance: 10
          rate-per-distance: 10.00
        - rate-per-distance: 8.00
      SUV:
        - max-distance: 5
          rate-per-distance: 15.00
        - max-distance: 10
          rate-per-distance: 12.00
        - rate-per-distance: 10.00
